server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Arquivos ausentes devem retornar 404, inclusive em rotas de assets.
    location ~* \.(?:js|mjs|wasm|css|json|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|otf|bin|map)$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
